name: 🚀 Feature Request
description: Suggest an idea for this project
title: '[Feature]: '
labels: ['enhancement']
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to fill out this feature request!

  - type: dropdown
    id: priority
    attributes:
      label: 🔥 Priority
      description: How important is this feature to you?
      options:
        - 🔥 Critical (blocking my work)
        - 🚩 High (important but not blocking)
        - 🌟 Medium (would be nice to have)
        - 🌱 Low (just an idea)
    validations:
      required: true

  - type: dropdown
    id: category
    attributes:
      label: 📊 Category
      description: What area does this feature relate to?
      options:
        - 📱 UI/UX
        - 🔧 Developer Tools
        - 🔄 Performance
        - 🔒 Security
        - 📈 Analytics
        - 📦 Data Management
        - 🔌 Integration
        - 📝 Documentation
        - 🧪 Testing
        - ✨ Other
    validations:
      required: true

  - type: dropdown
    id: experience
    attributes:
      label: 👤 User Experience Level
      description: What's your experience level with this project?
      options:
        - 🥇 Expert (daily user)
        - 🥈 Intermediate (regular user)
        - 🥉 Beginner (new user)
        - 👀 Just looking around
    validations:
      required: false

  - type: checkboxes
    id: considerations
    attributes:
      label: 🤔 Considerations
      description: Please confirm the following
      options:
        - label: 🔍 I have searched for existing feature requests
          required: true
        - label: 💭 I have considered alternative solutions
          required: false
        - label: 🤝 I'm willing to help implement this feature
          required: false

  - type: textarea
    id: feature-description
    attributes:
      label: 💡 Feature Description
      description: A clear and concise description of the feature you're proposing
      placeholder: As a user, I would like... so that I can...
    validations:
      required: true

  - type: textarea
    id: alternative-solutions
    attributes:
      label: 🔄 Alternative Solutions
      description: Describe any alternative solutions or features you've considered
      placeholder: I've tried doing X but it doesn't work because...
    validations:
      required: false

  - type: textarea
    id: additional-context
    attributes:
      label: 📎 Additional Context
      description: Add any other context, screenshots, or examples about the feature request here
    validations:
      required: false
