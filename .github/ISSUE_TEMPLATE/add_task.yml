name: 📋 Add Task
description: Create a new task for the project
title: '[Task]: '
labels: ['task']
body:
  - type: markdown
    attributes:
      value: |
        Please fill all of the fields for better task management.

  - type: dropdown
    id: size
    attributes:
      label: 📏 Size
      description: Estimated size/effort for this task
      options:
        - 🐭 S (small)
        - 🦊 M (medium)
        - 🐻 L (large)
        - 🐘 XL (extra large)
        - 🦖 XXL (extra extra large)
    validations:
      required: false

  - type: dropdown
    id: priority
    attributes:
      label: 🚦 Priority
      description: How important/urgent is this task?
      options:
        - 🔴 Critical
        - 🟠 High
        - 🟡 Medium
        - 🟢 Low
    validations:
      required: false

  - type: textarea
    id: description
    attributes:
      label: 📝 Task Description
      description: A description of the task to be completed
      placeholder: What needs to be done?
    validations:
      required: false

  - type: textarea
    id: additional-context
    attributes:
      label: 📎 Additional Context
      description: Add any files, images, or other context about this task
      placeholder: Drag and drop files here, or describe any additional context
    validations:
      required: false
