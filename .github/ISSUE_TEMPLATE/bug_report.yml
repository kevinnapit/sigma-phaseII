name: 🐛 Bug Report
description: Report a bug to help us improve
title: '[Bug]: '
labels: ['bug']
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to fill out this bug report!

  - type: dropdown
    id: severity
    attributes:
      label: 🚨 Severity
      description: How severe is this bug?
      options:
        - 💥 Critical (application crash/data loss)
        - 🔴 High (major feature broken)
        - 🟠 Medium (feature partially broken)
        - 🟡 Low (minor inconvenience)
    validations:
      required: true

  - type: dropdown
    id: reproducibility
    attributes:
      label: 🔄 Reproducibility
      description: How consistently can you reproduce this bug?
      options:
        - ✅ Always (100% reproducible)
        - 🔄 Frequently (happens most of the time)
        - ⚠️ Sometimes (happens occasionally)
        - ❓ Rarely (happened once or twice)
    validations:
      required: true

  - type: dropdown
    id: environment
    attributes:
      label: 🖥️ Environment
      description: Where are you experiencing the bug?
      options:
        - 🌐 Production
        - 🧪 Staging
        - 💻 Development
        - 📱 Mobile
        - 🌎 All environments
    validations:
      required: true

  - type: dropdown
    id: client
    attributes:
      label: 🌐 Client
      description: Which client(s) are you seeing the problem on?
      multiple: true
      options:
        - 📱 Mobile (Gawai)
        - 🦊 Firefox
        - 🌐 Chrome
        - 🧭 Safari
        - 🔵 Edge
        - 🔴 Opera
        - 🌐 All clients
    validations:
      required: true

  - type: textarea
    id: explanation
    attributes:
      label: 🔴 Brief Explanation
      description: A clear and concise description of the bug
      placeholder: When I click on X, the application crashes...
    validations:
      required: true

  - type: textarea
    id: reproduction-steps
    attributes:
      label: 📝 Steps To Reproduce
      description: Steps to reproduce the behavior
      placeholder: |
        1. Go to '...'
        2. Click on '...'
        3. Scroll down to '...'
        4. See error
    validations:
      required: false

  - type: textarea
    id: logs
    attributes:
      label: 📋 Relevant Logs
      description: Please copy and paste any relevant log output
      render: shell
    validations:
      required: false

  - type: textarea
    id: additional-context
    attributes:
      label: 📎 Additional Context
      description: Add any other context about the problem here
    validations:
      required: false
